name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tipos (app + Pages Functions)
        run: npm run check
      - name: Testes do motor de regras, cripto e servidor
        run: npm test
      - run: npm run build
      - name: Teste ponta a ponta
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
